<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

/* =====================
   基本設定
===================== */
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
height:100%;
scroll-snap-type:y mandatory;
scroll-behavior:smooth;
overflow-y:auto;
font-family:'Noto Serif TC',serif;
color:#333;
}

.en{font-family:'Playfair Display',serif;}

section{
min-height:100vh;
scroll-snap-align:start;
width:100%;
position:relative;
}

/* =====================
   1. 封面
===================== */
.hero{
height:100vh;
width:100%;
position:relative;
background:url("photo5.jpg") center/cover no-repeat;
}

/* 電腦版文字 */
.hero-text{
position:absolute;
left:40px;
bottom:60px;
font-size:42px;
letter-spacing:4px;
animation:fadeUp 1.2s ease forwards;
opacity:0;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* =====================
   2. 新人區（電腦）
===================== */
.couple-desktop{
display:flex;
justify-content:space-between;
align-items:center;
padding:80px 20px;
position:relative;
max-width:1200px;
margin:auto;
}

.couple-desktop img{
width:340px;
border-radius:10px;
}

.groom{align-self:flex-start;margin-top:-60px;}
.bride{align-self:flex-end;margin-bottom:-60px;}

.names{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
text-align:center;
font-size:28px;
line-height:1.6;
}

/* =====================
   2. 新人區（手機）
===================== */
.couple-mobile{
display:none;
}

/* =====================
   3. 日期 + 圖片
===================== */
.date-section img{
width:100%;
height:100vh;
object-fit:cover;
}

.date-text{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:34px;
color:#fff;
}

/* =====================
   4. 地圖
===================== */
.location{
text-align:center;
padding:80px 20px;
}

.map-box{
max-width:560px;
margin:auto;
background:#eee;
padding:16px;
position:relative;
}

.map-box img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
}

.map-text{
text-align:left;
margin-top:12px;
}

.map-link{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
padding:10px 18px;
background:rgba(255,255,255,.85);
border-radius:999px;
border:1px solid #333;
text-decoration:none;
color:#333;
}

/* =====================
   5. 倒數
===================== */
.countdown{
text-align:center;
font-size:28px;
padding:60px 20px;
}

/* =====================
   手機版
===================== */
@media(max-width:768px){

/* 封面 */
.hero-text{
left:50%;
bottom:28px;
transform:translateX(-50%);
text-align:center;
font-size:28px;
}

/* 新人 */
.couple-desktop{display:none;}

.couple-mobile{
display:grid;
grid-template-columns:1fr 1fr 1fr;
align-items:center;
padding:40px 10px;
gap:4px;
}

/* 男生（左上） */
.groom-mobile{
display:flex;
align-items:flex-start;
gap:6px;
}

.groom-mobile img{
width:80px;
border-radius:8px;
}

.name-v{
writing-mode:vertical-rl;
font-size:14px;
}

/* 中間文字 */
.center-text{
text-align:center;
font-size:13px;
line-height:1.3;
}

/* 女生（右下） */
.bride-mobile{
display:flex;
align-items:flex-start;
gap:6px;
justify-content:flex-end;
}

.bride-mobile img{
width:80px;
border-radius:8px;
}

/* 日期 */
.date-section img{
height:40vh;
}

}

</style>
</head>

<body>

<!-- 封面 -->
<section class="hero">
<div class="hero-text">徐生有李，聚在這裡</div>
</section>

<!-- 新人 -->
<section>

<!-- 電腦版 -->
<div class="couple-desktop">
<img src="photo8.jpg" class="groom">

<div class="names">
徐王麟 &amp; 李亦晴<br>
<span class="en">we tied the knot.</span>
</div>

<img src="photo7.jpg" class="bride">
</div>

<!-- 手機版 -->
<div class="couple-mobile">

<div class="groom-mobile">
<div class="name-v">徐王麟</div>
<img src="photo8.jpg">
</div>

<div class="center-text en">
We<br>
tied<br>
the<br>
knot
</div>

<div class="bride-mobile">
<img src="photo7.jpg">
<div class="name-v">李亦晴</div>
</div>

</div>
</section>

<!-- 日期 -->
<section class="date-section">
<div class="date-text en">10.03</div>
<img src="photo9.jpg">
</section>

<!-- 地圖 -->
<section class="location">
<div class="map-box">
<a class="map-link" href="https://maps.app.goo.gl/QE6gDtQd72aYG2VS8">Google Map</a>
<img src="JUN_0172.jpg">
<div class="map-text">茹曦酒店<br>捷運</div>
</div>
</section>

<!-- 倒數 -->
<section class="countdown en" id="countdown"></section>

<script>
const weddingDate=new Date("2026-10-03T12:30:00");

function update(){
const now=new Date();
const diff=weddingDate-now;
const days=Math.max(0,Math.floor(diff/86400000));
document.getElementById("countdown").innerText=
"距離婚禮還有 " + days + " DAYS";
}

update();
setInterval(update,1000);
</script>

</body>
</html>
