<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC&family=Playfair+Display&display=swap" rel="stylesheet">

<style>

/* =====================
   基本
===================== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Noto Serif TC',serif;
color:#333;
overflow-x:hidden;
}

.en{font-family:'Playfair Display',serif;}

section{
width:100%;
}

/* =====================
   封面
===================== */
.hero{
height:100vh;
background:url("photo5.jpg") center/cover no-repeat;
position:relative;
display:flex;
align-items:flex-end;
justify-content:flex-start;
padding:60px 40px;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
}

.hero-text{
position:relative;
z-index:2;
font-size:42px;
letter-spacing:4px;
animation:fadeUp 1.2s ease forwards;
opacity:0;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* =====================
   新人（電腦）
===================== */
.couple{
max-width:1200px;
margin:auto;
padding:80px 20px;
display:flex;
justify-content:space-between;
align-items:center;
position:relative;
}

.couple img{
width:340px;
border-radius:10px;
}

.groom{align-self:flex-start;margin-top:-60px;}
.bride{align-self:flex-end;margin-bottom:-60px;}

.names{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
text-align:center;
font-size:28px;
line-height:1.6;
}

/* =====================
   日期區
===================== */
.date-section{
position:relative;
}

.date-section img{
width:100%;
height:100vh;
object-fit:cover;
border:10px solid #fff;
}

.date-text{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:34px;
color:#fff;
z-index:2;
}

/* =====================
   地圖
===================== */
.location{
text-align:center;
padding:80px 20px;
}

.map-box{
max-width:560px;
margin:auto;
background:#eee;
padding:16px;
position:relative;
}

.map-box img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
}

.map-link{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
padding:10px 18px;
border-radius:999px;
border:1px solid #333;
background:rgba(255,255,255,0.85);
text-decoration:none;
color:#333;
transition:0.3s;
}

.map-link:hover{
background:#333;
color:#fff;
}

.map-text{
text-align:left;
margin-top:12px;
}

/* =====================
   倒數
===================== */
.countdown{
text-align:center;
padding:60px 20px;
font-size:28px;
}

/* =====================
   手機版
===================== */
@media(max-width:768px){

/* 封面：一行字 */
.hero{
justify-content:center;
align-items:flex-end;
padding:0 20px 40px;
}

.hero-text{
font-size:28px;
text-align:center;
width:100%;
}

/* 新人 */
.couple{
display:none;
}

.mobile-couple{
display:grid;
grid-template-columns:1fr 1fr 1fr;
align-items:center;
padding:40px 10px;
gap:6px;
}

/* 男（左上） */
.groom-mobile{
display:flex;
align-items:flex-start;
gap:6px;
justify-content:flex-start;
}

.groom-mobile img{
width:80px;
border-radius:8px;
}

.name-v{
writing-mode:vertical-rl;
font-size:14px;
}

/* 中間 */
.center-text{
text-align:center;
font-size:13px;
line-height:1.3;
}

/* 女（右下 + 名字右下） */
.bride-mobile{
display:flex;
align-items:flex-end;
gap:6px;
justify-content:flex-end;
}

.bride-mobile img{
width:80px;
border-radius:8px;
}

/* 日期 */
.date-section img{
height:40vh;
border:6px solid #fff;
}

}

/* =====================
   按鈕 hover（桌機）
===================== */
@media(min-width:769px){
.map-link:hover{
transform:translate(-50%,-50%) scale(1.05);
}
}

</style>
</head>

<body>

<!-- 封面 -->
<section class="hero">
<div class="hero-text">徐生有李，聚在這裡</div>
</section>

<!-- 新人 -->
<section class="couple">

<div class="groom">
<img src="photo8.jpg">
</div>

<div class="names">
徐王麟 &amp; 李亦晴<br>
<span class="en">we tied the knot.</span>
</div>

<div class="bride">
<img src="photo7.jpg">
</div>

</section>

<!-- 手機新人 -->
<section class="mobile-couple">

<div class="groom-mobile">
<div class="name-v">徐王麟</div>
<img src="photo8.jpg">
</div>

<div class="center-text en">
We<br>
tied<br>
the<br>
knot
</div>

<div class="bride-mobile">
<img src="photo7.jpg">
<div class="name-v">李亦晴</div>
</div>

</section>

<!-- 日期 -->
<section class="date-section">
<div class="date-text en">10.03</div>
<img src="photo9.jpg">
</section>

<!-- 地圖 -->
<section class="location">
<div class="map-box">
<a class="map-link" href="https://maps.app.goo.gl/QE6gDtQd72aYG2VS8">Google Map</a>
<img src="JUN_0172.jpg">
<div class="map-text">茹曦酒店<br>捷運</div>
</div>
</section>

<!-- 倒數 -->
<section class="countdown en" id="countdown"></section>

<script>
const weddingDate=new Date("2026-10-03T12:30:00");

function update(){
const now=new Date();
const diff=weddingDate-now;
const days=Math.max(0,Math.floor(diff/86400000));
document.getElementById("countdown").innerText=
"距離婚禮還有 " + days + " DAYS";
}

update();
setInterval(update,1000);
</script>

</body>
</html>
