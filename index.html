<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}

html,body{
height:100%;
scroll-behavior:smooth;
scroll-snap-type:y mandatory;
overflow-y:auto;
font-family:'Noto Serif TC',serif;
color:#333;
}

.en{font-family:'Playfair Display',serif;}

section{
min-height:100vh;
scroll-snap-align:start;
scroll-snap-stop:always;
width:100%;
position:relative;
}

img{display:block;}

/* ===== HERO ===== */
.hero{
height:100vh;
width:100%;
background:url('photo5.jpg') center center no-repeat;
background-size:auto 100%;
position:relative;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:rgba(255,255,255,0.35);
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.hero-text{
position:absolute;
left:40px;
bottom:40px;
font-size:42px;
letter-spacing:4px;
z-index:2;
animation:fadeUp 1.2s ease forwards;
opacity:0;
}

/* ===== COUPLE ===== */
.couple{
max-width:1200px;
margin:0 auto;
padding:80px 20px;
display:flex;
justify-content:space-between;
align-items:center;
position:relative;
}

.couple img{
max-width:360px;
border-radius:10px;
}

.groom{align-self:flex-start;margin-top:-60px;}
.bride{align-self:flex-end;margin-bottom:-60px;}

.names{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
text-align:center;
font-size:28px;
line-height:1.8;
width:420px;
}

/* ===== LOCATION ===== */
.location{
text-align:center;
padding:80px 20px;
}

.location-title{
font-size:34px;
}

.location-title span{
display:block;
margin-left:90px;
}

.map-box{
max-width:560px;
margin:20px auto;
padding:16px;
background:#eee;
position:relative;
text-align:left;
}

.map-box img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
}

.map-link{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
padding:10px 20px;
border:1px solid #333;
border-radius:999px;
background:rgba(255,255,255,0.85);
text-decoration:none;
color:#333;
transition:0.3s;
}

.map-link:hover{
background:#333;
color:#fff;
}

.map-text{
margin-top:12px;
text-align:right;
padding-right:4px;
line-height:1.6;
}

/* ===== GALLERY CAROUSEL ===== */
.gallery-wrapper{
padding:80px 0;
overflow:hidden;
}

.gallery-row{
display:flex;
gap:12px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding:0 20px;
}

.gallery-row img{
min-width:70%;
aspect-ratio:3/4;
object-fit:cover;
border-radius:10px;
scroll-snap-align:center;
}

/* ===== COUNTDOWN ===== */
.countdown{
text-align:center;
font-size:28px;
padding:60px 20px;
}

/* ===== MOBILE ===== */
@media (max-width:768px){

.hero-text{
left:50%;
bottom:28px;
transform:translateX(-50%);
font-size:28px;
text-align:center;
width:90%;
}

.couple{
display:none;
}

.mobile-couple{
min-height:100vh;
padding:50px 14px;
display:grid;
grid-template-columns:1fr 1fr 1fr;
align-items:center;
}

.side{
display:flex;
align-items:center;
}

.side img{
width:84px;
border-radius:8px;
}

.left-top{justify-content:flex-start;align-self:start;margin-top:-18px;}
.right-bottom{justify-content:flex-end;align-self:end;margin-bottom:-18px;}

.name-vertical{
writing-mode:vertical-rl;
font-size:14px;
}

.center-text{
text-align:center;
font-size:13px;
line-height:1.5;
}

}
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
<div class="hero-text">徐生有李，聚在這裡</div>
</section>

<!-- COUPLE DESKTOP -->
<section>
<div class="couple">
<img src="photo8.jpg" class="groom">
<div class="names">徐王麟 &amp; 李亦晴<br><span class="en">We tied the knot.</span></div>
<img src="photo7.jpg" class="bride">
</div>

<!-- MOBILE COUPLE -->
<div class="mobile-couple">
<div class="side left-top"><div class="name-vertical">徐王麟</div><img src="photo8.jpg"></div>
<div class="center-text en">We<br>tied<br>the<br>knot.</div>
<div class="side right-bottom"><img src="photo7.jpg"><div class="name-vertical">李亦晴</div></div>
</div>
</section>

<!-- DATE -->
<section>
<div class="location-title en" style="text-align:center;padding-top:40px;">10.03</div>
<img src="photo9.jpg" style="width:100%;height:100vh;object-fit:cover;">
</section>

<!-- LOCATION -->
<section class="location">
<div class="location-title en">How to<span>get there</span></div>
<div class="map-box">
<a class="map-link" href="https://maps.app.goo.gl/QE6gDtQd72aYG2VS8" target="_blank">查看 Google 地圖</a>
<img src="JUN_0172.jpg">
<div class="map-text">茹曦酒店<br>捷運</div>
</div>
</section>

<!-- GALLERY CAROUSEL -->
<section class="gallery-wrapper">
<div class="gallery-row">
<img src="photo4.jpg">
<img src="photo3.jpg">
<img src="photo5.jpg">
</div>
</section>

<!-- COUNTDOWN -->
<section class="countdown en" id="countdown"></section>

<script>
const weddingDate=new Date('2026-10-03T12:30:00');
function update(){
const now=new Date();
const diff=weddingDate-now;
const days=Math.max(0,Math.floor(diff/86400000));
document.getElementById('countdown').textContent='距離婚禮還有 '+days+' DAYS';
}
update();setInterval(update,1000);
</script>

</body>
</html>
