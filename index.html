<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Playfair+Display&display=swap" rel="stylesheet">

<style>

/* ======================
   基本
====================== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:"Noto Serif TC",serif;
color:#333;
}

.en{font-family:"Playfair Display",serif;}

/* ======================
   SECTION
====================== */
section{
width:100%;
position:relative;
}

/* ======================
   1. 封面
====================== */
.hero{
height:100vh;
background:url("photo5.jpg") center center no-repeat;
background-size:auto 100%;
position:relative;
}

.hero-text{
position:absolute;
left:38%;
bottom:18%;
font-size:40px;
white-space:nowrap;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* ======================
   2. 新人區（電腦）
====================== */
.couple{
max-width:1000px;
margin:auto;
height:700px;
position:relative;
}

.couple img{
width:320px;
border-radius:10px;
position:absolute;
z-index:1;
}

.groom{
left:5%;
top:40px;
}

.bride{
right:5%;
bottom:40px;
}

.names{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
text-align:center;
font-size:28px;
line-height:1.6;
z-index:5
}

/* ======================
   3. 日期區
====================== */
.date{
position:relative;
}

.date img{
width:100%;
height:300vh;
object-fit:cover;
object-position:top center;
}

.date::before{
content:"";
position:absolute;
inset:12px;
border:2px solid #fff;
z-index:2;
}

.date-text{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:34px;
color:#fff;
z-index:3;
}

/* ======================
   4. 地圖
====================== */
.location{
text-align:center;
padding:80px 20px;
}

.map-box{
max-width:500px;
margin:auto;
background:#eee;
padding:16px;
position:relative;
}

.map-box img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
}

.map-link{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
padding:10px 18px;
border-radius:999px;
border:1px solid #333;
background:#fff;
text-decoration:none;
transition:0.3s;
color:#333;
}

.map-link:hover{
background:#333;
color:#fff;
}

.map-text{
text-align:left;
margin-top:12px;
}

/* ======================
   5. 倒數
====================== */
.countdown{
text-align:center;
padding:60px;
font-size:28px;
}

/* ======================
   📱 手機版
====================== */
@media(max-width:768px){

/* 封面 */
.hero-text{
left:50%;
bottom:20%;
transform:translateX(-50%);
font-size:26px;
text-align:center;
}

/* 新人 */
.couple{
padding:70px 10px !important;
min-height:500px !important;
height:auto !important;
overflow:visible;
}

.couple img{
width:120px;
}

/* 男 */
.groom{
left:6%;
top:20px;
}

/* 女 */
.bride{
right:6%;
bottom:-40px;
}

/* 中間文字 */
.names{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:16px;
line-height:1.4;
width:160px;
}

/* 日期 */
.date img{
height:35vh;
object-position:top;
}

}

</style>
</head>

<body>

<!-- 封面 -->
<section class="hero">
<div class="hero-text">徐生有李，聚在這裡</div>
</section>

<!-- 新人 -->
<section class="couple">

<img src="photo8.jpg" class="groom">

<div class="names">
徐王麟 &amp; 李亦晴<br>
<span class="en">We tied the knot.</span>
</div>

<img src="photo7.jpg" class="bride">

</section>

<!-- 日期 -->
<section class="date">
<div class="date-text en">10.03</div>
<img src="photo9.jpg">
</section>

<!-- 地圖 -->
<section class="location">

<div class="map-box">
<a class="map-link" href="https://maps.app.goo.gl/QE6gDtQd72aYG2VS8">Google Map</a>
<img src="JUN_0172.jpg">
<div class="map-text">茹曦酒店<br>捷運</div>
</div>

</section>

<!-- 倒數 -->
<section class="countdown en" id="countdown"></section>

<script>
const weddingDate=new Date("2026-10-03T12:30:00");

function update(){
const now=new Date();
const diff=weddingDate-now;
const days=Math.max(0,Math.floor(diff/86400000));
document.getElementById("countdown").innerText=
"距離婚禮還有 " + days + " DAYS";
}

update();
setInterval(update,1000);
</script>

</body>
</html>
